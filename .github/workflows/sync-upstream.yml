name: Check upstream updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare main with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          behind=$(gh api "repos/$FORK_REPO/compare/main...MarSeventh:main" --jq '.ahead_by')
          if [[ ! "$behind" =~ ^[0-9]+$ ]]; then
            echo "Unexpected upstream comparison result" >&2
            exit 1
          fi
          if (( behind == 0 )); then
            echo 'The fork already contains upstream main.' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              printf 'Upstream main has %s commit(s) to review.\n\n' "$behind"
              printf '[Compare upstream changes](https://github.com/%s/compare/main...MarSeventh:main)\n\n' "$FORK_REPO"
              echo 'Merge upstream in a maintenance branch, resolve conflicts and run regression checks before opening a pull request into main.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
